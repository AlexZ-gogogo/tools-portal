<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tools Portal - 工具门户</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top-nav">
    <div class="nav-left">
      <button class="hamburger-btn" id="menuToggle" type="button" aria-label="展开导航" aria-expanded="false"><i class="fas fa-bars" aria-hidden="true"></i></button>
      <a class="brand" href="#all"><div class="brand-icon"><i class="fas fa-cubes" aria-hidden="true"></i></div><span class="brand-text">Tools Portal</span></a>
    </div>
    <div class="nav-center"><div class="search-box"><i class="fas fa-search search-icon" aria-hidden="true"></i><input type="search" id="searchInput" placeholder="搜索工具、服务和应用 (Ctrl+/)" aria-label="搜索工具"><kbd class="search-shortcut">Ctrl+/</kbd></div></div>
    <div class="nav-right">
      <button class="nav-icon-btn" id="fullscreenButton" type="button" aria-label="全屏"><i class="fas fa-expand" aria-hidden="true"></i></button>
      <button class="nav-icon-btn" id="themeButton" type="button" aria-label="切换主题"><i class="fas fa-moon" aria-hidden="true"></i></button>
    </div>
  </header>
  <div class="main-layout">
    <nav class="sidebar" id="sidebar" aria-label="主导航">
      <div class="sidebar-menu">
        <a class="sidebar-item" href="#all" data-filter="all" aria-label="全部工具"><i class="fas fa-home" aria-hidden="true"></i><span class="sidebar-label">全部工具</span></a>
        <a class="sidebar-item" href="#ai" data-filter="ai" aria-label="AI 工具"><i class="fas fa-brain" aria-hidden="true"></i><span class="sidebar-label">AI 工具</span></a>
        <a class="sidebar-item" href="#azure" data-filter="azure" aria-label="Azure 工具"><i class="fas fa-cloud" aria-hidden="true"></i><span class="sidebar-label">Azure 工具</span></a>
        <a class="sidebar-item" href="#tool" data-filter="tool" aria-label="效率工具"><i class="fas fa-wrench" aria-hidden="true"></i><span class="sidebar-label">效率工具</span></a>
        <div class="sidebar-divider"></div>
        <a class="sidebar-item" href="#logs/aoai-deploy" data-page="logs" aria-label="更新日志"><i class="fas fa-history" aria-hidden="true"></i><span class="sidebar-label">更新日志</span></a>
        <a class="sidebar-item" href="#manage/aoai-deploy" data-page="manage" aria-label="日志管理"><i class="fas fa-cloud-upload-alt" aria-hidden="true"></i><span class="sidebar-label">日志管理</span></a>
      </div>
      <div class="sidebar-bottom"><span class="sidebar-label" id="appCount">工具门户</span></div>
    </nav>
    <main class="content" id="mainContent">
      <div id="globalStatus" class="status-banner" role="status" hidden></div>
      <div id="pageContent"><div class="loading-state">正在加载工具与更新日志…</div></div>
      <noscript>请启用 JavaScript 查看工具和更新日志。</noscript>
      <footer class="portal-footer"><span>Tools Portal · 工具与更新记录</span><span id="currentDate"></span></footer>
    </main>
  </div>
</body>
</html>
